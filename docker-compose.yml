services:
  db:
    image: postgres:16-alpine
    container_name: werodev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: WeroDev
      POSTGRES_PASSWORD: Wesaso
      POSTGRES_DB: WeroBase
    ports:
      - "5432:5432"
    volumes:
      - werodev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U WeroDev -d WeroBase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  werodev_pgdata:
